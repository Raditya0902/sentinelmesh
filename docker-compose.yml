volumes:
  logs:
  chromadb_data:
  api_data:

services:
  chromadb:
    image: chromadb/chroma:0.6.3
    ports:
      - "8001:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
    restart: always

  lobstertrap:
    build:
      context: .
      dockerfile: lobstertrap/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - logs:/app/logs
    environment:
      - BACKEND_URL=${LLM_BACKEND_URL:-http://host.docker.internal:11434}
      # agent_id → key map; the proxy refuses to start without a key per registered agent
      - LT_AGENT_KEYS=${LT_AGENT_KEYS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - lobstertrap
      - chromadb
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - LOBSTER_TRAP_URL=http://lobstertrap:8080
      - AUDIT_LOG_PATH=logs/audit.jsonl
      # Paused human-review runs survive API restarts (named volume below)
      - SENTINEL_CHECKPOINT_DB=data/checkpoints.sqlite
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-openai/gpt-oss-120b}
      - SENTINEL_API_KEY=${SENTINEL_API_KEY:-}
      # SENTINEL_CALLER_KEYS, SENTINEL_DEMO_MODE and LT_AGENT_KEYS come from .env via env_file
    # Single worker: the rate limiter is per process.
    command: uvicorn --factory api.main:create_app --host 0.0.0.0 --port 8000 --workers 1
    volumes:
      - logs:/app/logs
      - api_data:/app/data
    restart: always

  dashboard:
    build: .
    ports:
      - "8501:8501"
    # No env_file: the dashboard only needs the vars below, not agent/caller secrets.
    depends_on:
      - api
      - lobstertrap
    environment:
      - API_URL=http://api:8000
      - LOBSTER_TRAP_URL=http://lobstertrap:8080
      - AUDIT_LOG_PATH=logs/audit.jsonl
      - SENTINEL_API_KEY=${SENTINEL_API_KEY:-}
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    volumes:
      - logs:/app/logs
    restart: always
