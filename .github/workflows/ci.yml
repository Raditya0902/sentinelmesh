name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-lobstertrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: lobstertrap/go.mod
          cache-dependency-path: lobstertrap/go.sum
          
      - name: Check gofmt
        working-directory: ./lobstertrap
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Run Go tests
        working-directory: ./lobstertrap
        run: go test ./... -v
        
      - name: Build Lobster Trap
        working-directory: ./lobstertrap
        run: go build -o lobstertrap .

      - name: Run Policy Tests
        run: ./lobstertrap/lobstertrap test --policy proxy/policy.yaml

      - name: Upload lobstertrap binary
        uses: actions/upload-artifact@v4
        with:
          name: lobstertrap-binary
          path: lobstertrap/lobstertrap
          retention-days: 1

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # The chroma-hnswlib wheel is built with -march=native and dies with
          # SIGILL on some runner CPUs (seen on AMD EPYC 9V74), so rebuild it
          # for a generic x86-64 target.
          HNSWLIB_NO_NATIVE=1 pip install --force-reinstall --no-deps --no-binary chroma-hnswlib "chroma-hnswlib==$(pip show chroma-hnswlib | awk '/^Version:/{print $2}')"
          
      - name: Run Python tests
        run: |
          PYTHONPATH=. pytest tests/ --cov --cov-fail-under=80
          grep -m1 'model name' /proc/cpuinfo
          PYTHONPATH=. python -X faulthandler tests/run_attacks.py

  test-attacks-stack:
    runs-on: ubuntu-latest
    needs: [test-lobstertrap]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download lobstertrap binary
        uses: actions/download-artifact@v4
        with:
          name: lobstertrap-binary
          path: lobstertrap/

      - name: Make binary executable
        run: chmod +x lobstertrap/lobstertrap

      - name: Start stack (no LLM backend)
        run: |
          cp .env.example .env
          echo "SENTINEL_DEMO_MODE=1" >> .env
          sed -i '/^LT_AGENT_KEYS=$/d' .env
          make keys | grep '^LT_AGENT_KEYS=' >> .env
          docker compose up -d chromadb lobstertrap api
          timeout 60 bash -c 'until curl -sf http://localhost:8000/health; do sleep 2; done'

      - name: Run attack suite with live proxy
        run: PYTHONPATH=. REQUIRE_PROXY=1 SKIP_LLM_TESTS=1 python -X faulthandler tests/run_attacks.py

      - name: Stop stack
        if: always()
        run: docker compose down
